project:
  name: "vulture-x"
  environment: "sitl"

vehicle:
  connection: "udpin:0.0.0.0:14550"
  source_system: 191
  source_component: 191
  expected_autopilot: "ARDUPILOTMEGA"
  expected_vehicle_type: "QUADROTOR"
  guided_mode: "GUIDED"
  hold_mode: "LOITER"
  recovery_mode: "RTL"
  takeoff_altitude_m: 10.0

vision:
  source: "synthetic"
  width: 640
  height: 480
  fps: 30.0
  tracker: "CSRT"
  show_window: true
  random_seed: 42
  target_shape: "rectangle"
  target_width_px: 72
  target_height_px: 54
  target_speed_x_px_s: 90.0
  target_speed_y_px_s: 45.0
  background_bgr: [24, 24, 24]
  target_bgr: [40, 220, 255]
  noise_stddev: 0.0
  disappear_after_frame: 240
  disappear_duration_frames: 45
  sudden_move_frame: 420
  frame_delay_s: 0.0

guidance:
  update_rate_hz: 10.0
  max_forward_speed_mps: 5.0
  max_lateral_speed_mps: 3.0
  max_vertical_speed_mps: 2.0
  max_acceleration_mps2: 1.5
  max_yaw_rate_deg_s: 30.0
  horizontal_deadband: 0.05
  vertical_deadband: 0.05
  target_size_setpoint: 0.12

safety:
  minimum_tracking_confidence: 0.6
  tracking_warning_timeout_s: 0.3
  tracking_abort_timeout_s: 1.0
  mavlink_heartbeat_timeout_s: 2.0
  command_expiration_s: 0.25
  minimum_separation_m: 10.0
  maximum_test_speed_mps: 5.0

logging:
  level: "INFO"
  directory: "./logs"
  event_jsonl: true
  telemetry_csv: true

